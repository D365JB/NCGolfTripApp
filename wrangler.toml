name = "cherokee-cup"
main = "worker/index.js"
compatibility_date = "2024-11-01"

# Serve the built SPA (Vite output) as static assets; the Worker handles /api/*.
[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"

# Cloudflare D1 database, available to the Worker as `env.DB`.
[[d1_databases]]
binding = "DB"
database_name = "cherokee-cup-db"
database_id = "f2742301-ea26-4dee-85b3-9df20729fe99"
